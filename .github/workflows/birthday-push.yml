name: إشعار عيد الميلاد

# منتصف ليل عيدها بتوقيت دمشق.
#
# دمشق على UTC+3 طوال السنة — ألغت سوريا التوقيت الصيفي عام 2022 — فمنتصف
# الليل هو 21:00 UTC بلا استثناء، ولا حاجة لتصحيح موسمي.
#
# ⚠️ جدولة GitHub Actions **ليست دقيقة**: التشغيل يتأخّر من خمس دقائق إلى
# خمس عشرة في ساعات الذروة، ورأس الساعة UTC أزحمها. لذلك رسالتان:
# الأولى قبل ربع ساعة بصياغة لا تدّعي دقّة، والثانية عند منتصف الليل بصياغة
# تصحّ متأخّرةً كما تصحّ في وقتها. ولا واحدة منهما تقول «الآن الساعة ١٢».
#
# وللضمان: التشغيل اليدوي متاح، فإن تأخّرت الجدولة أُرسلت بضغطة زر.
on:
  schedule:
    - cron: '45 20 5 9 *' # 23:45 بتوقيت دمشق، ليلة العيد
    - cron: '0 21 5 9 *' # 00:00 بتوقيت دمشق، صباح العيد
  workflow_dispatch:
    inputs:
      which:
        description: أي رسالة؟
        required: true
        default: midnight
        type: choice
        options: [midnight, soon]

permissions: {}

concurrency:
  group: birthday-push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # النصّ يُختار هنا لا في `run`: وضع نصّ عربي حرّ داخل سطر أمر يفتح باب
      # تنفيذ ما بين $( ) كأمر shell.
      - name: اختيار الرسالة
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          WHICH: ${{ inputs.which }}
        run: |
          if [ "$SCHEDULE" = '45 20 5 9 *' ] || [ "$WHICH" = 'soon' ]; then
            {
              echo 'title=رغد 🤍'
              echo 'body=ضلّ شوي… في شي مستنّيكي عالموقع'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'title=عيد ميلاد سعيد يا رغد 🤍'
              echo 'body=صار عيد ميلادك. تعي عالموقع، في شمعات مولّعة ناطرتك 🎂'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Send
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
          PUSH_TITLE: ${{ steps.pick.outputs.title }}
          PUSH_BODY: ${{ steps.pick.outputs.body }}
          PUSH_URL: https://znad-odoo-dev.github.io/raghad-reminder/
        run: node scripts/send-push.mjs

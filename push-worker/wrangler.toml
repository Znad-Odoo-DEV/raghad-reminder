name = "raghd-push"
main = "src/index.js"
compatibility_date = "2026-08-01"

# صريحان بدل الاعتماد على الافتراضي: النشر على workers.dev مقصود، وروابط
# المعاينة مطفأة لأنها تنشر نسخة إضافية من نقطة الاستقبال بلا داعٍ.
workers_dev = true
preview_urls = false

# مساحة تخزين اشتراك رغد.
#
# أُنشئت بـ:  npx wrangler kv namespace create SUBS
# المعرّف ليس سرّاً — لا يفيد أحداً بلا صلاحيات الحساب.
[[kv_namespaces]]
binding = "SUBS"
id = "af38b2015c554357b66b542dbc64c462"

[vars]
ALLOWED_ORIGIN = "https://znad-odoo-dev.github.io"

# ADMIN_TOKEN ليس هنا عمداً — يُضبط كسرّ:
#   npx wrangler secret put ADMIN_TOKEN

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f7f4ff"/>
      <stop offset="100%" stop-color="#efe9ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ff6fb5" stop-opacity=".48"/>
      <stop offset="100%" stop-color="#ff6fb5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6d4aff" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#6d4aff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8ec7"/>
      <stop offset="55%" stop-color="#ff4d8d"/>
      <stop offset="100%" stop-color="#6d4aff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="1010" cy="90" r="330" fill="url(#glowA)"/>
  <circle cx="170" cy="580" r="300" fill="url(#glowB)"/>

  <g font-family="'IBM Plex Sans Arabic','Tajawal','Segoe UI',sans-serif" text-anchor="end">
    <text x="1080" y="200" font-size="34" font-weight="600" fill="#7a72a3">الحمد لله على السلامة</text>
    <text x="1080" y="300" font-size="80" font-weight="700" fill="#171238">رغد طابت،</text>
    <text x="1080" y="392" font-size="80" font-weight="700" fill="#d62d78">الحمد لله.</text>
    <text x="1080" y="462" font-size="34" font-weight="500" fill="#443c6d">ألطف وأجمل صدفة بحياتي — وصارت بخير.</text>
    <text x="1080" y="512" font-size="30" font-weight="600" fill="#6d4aff" direction="ltr">super special</text>
  </g>

  <g transform="translate(196 312) scale(3.5) translate(-32 -28.5)">
    <path d="M32 53C32 53 4 36.5 4 20.5 4 11.4 11.2 4 20.2 4 25.6 4 30.2 6.9 32 11.2 33.8 6.9 38.4 4 43.8 4 52.8 4 60 11.4 60 20.5 60 36.5 32 53 32 53Z" fill="url(#heartGrad)"/>
    <ellipse cx="20" cy="17" rx="8" ry="5" fill="#ffffff" opacity=".55" transform="rotate(-24 20 17)"/>
  </g>

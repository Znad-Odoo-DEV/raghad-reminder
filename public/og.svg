<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f7f4ff"/>
      <stop offset="100%" stop-color="#efe9ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".48"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6d4aff" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#6d4aff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="55%" stop-color="#8b6bff"/>
      <stop offset="100%" stop-color="#6d4aff"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b6bff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="1010" cy="90" r="330" fill="url(#glowA)"/>
  <circle cx="170" cy="580" r="300" fill="url(#glowB)"/>

  <g font-family="'IBM Plex Sans Arabic','Tajawal','Segoe UI',sans-serif" text-anchor="end">
    <text x="1080" y="200" font-size="34" font-weight="600" fill="#7a72a3">في شي جاي 🎁</text>
    <text x="1080" y="300" font-size="80" font-weight="700" fill="#171238">رغد، ترقّبي</text>
    <text x="1080" y="392" font-size="80" font-weight="700" fill="#6d4aca">المفاجأة.</text>
    <text x="1080" y="462" font-size="34" font-weight="500" fill="#443c6d">ما رح نقول شو، ولا إيمتى.</text>
    <text x="1080" y="512" font-size="30" font-weight="600" fill="#6d4aff" direction="ltr">super special</text>
  </g>

  <!-- علبة الهدية — نفس رسم GiftGlyph بمقياس أكبر -->
  <g transform="translate(196 300) scale(3.4) translate(-32 -30)">
